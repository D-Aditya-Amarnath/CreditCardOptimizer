{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Transaction History</h1>
        <div class="flex gap-2">
            <select id="profile-filter" onchange="loadTransactions()" class="border rounded-lg px-3 py-2 text-sm">
                <option value="">All Profiles</option>
            </select>
            <select id="days-filter" onchange="loadTransactions()" class="border rounded-lg px-3 py-2 text-sm">
                <option value="30">Last 30 days</option>
                <option value="90" selected>Last 90 days</option>
                <option value="180">Last 6 months</option>
                <option value="365">Last year</option>
            </select>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow">
        <div class="overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Merchant</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Category</th>
                        <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Amount</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Card</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Bank</th>
                    </tr>
                </thead>
                <tbody id="transactions-table" class="divide-y divide-gray-200">
                    <tr>
                        <td colspan="6" class="px-4 py-8 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin mr-2"></i>Loading transactions...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="px-4 py-3 border-t flex justify-between items-center">
            <div id="pagination-info" class="text-sm text-gray-500"></div>
            <div class="flex gap-2">
                <button id="prev-btn" onclick="prevPage()" disabled class="px-3 py-1 border rounded-lg text-sm hover:bg-gray-50 disabled:opacity-50">Previous</button>
                <button id="next-btn" onclick="nextPage()" disabled class="px-3 py-1 border rounded-lg text-sm hover:bg-gray-50 disabled:opacity-50">Next</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentOffset = 0;
const limit = 20;

async function loadTransactions() {
    const days = document.getElementById('days-filter').value;
    const profileId = document.getElementById('profile-filter').value;
    
    let url = `/api/transactions/?days=${days}&limit=${limit}&offset=${currentOffset}`;
    if (profileId) url += `&profile_id=${profileId}`;
    
    const res = await fetch(url);
    if (res.ok) {
        const data = await res.json();
        renderTransactions(data.transactions);
        updatePagination(data.total);
    }
}

function renderTransactions(transactions) {
    const tbody = document.getElementById('transactions-table');
    
    if (transactions.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="px-4 py-8 text-center text-gray-500">
                    No transactions found
                </td>
            </tr>
        `;
        return;
    }
    
    tbody.innerHTML = transactions.map(t => `
        <tr class="hover:bg-gray-50">
            <td class="px-4 py-3 text-sm text-gray-900">${t.transaction_date ? new Date(t.transaction_date).toLocaleDateString() : '-'}</td>
            <td class="px-4 py-3">
                <div class="text-sm font-medium text-gray-900">${t.merchant_normalized || t.merchant_raw || 'Unknown'}</div>
                ${t.merchant_raw && t.merchant_normalized ? `<div class="text-xs text-gray-400">${t.merchant_raw}</div>` : ''}
            </td>
            <td class="px-4 py-3">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
                    ${getCategoryEmoji(t.category)} ${t.category || 'other'}
                </span>
            </td>
            <td class="px-4 py-3 text-right text-sm font-medium text-gray-900">
                ₹${(t.amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 })}
            </td>
            <td class="px-4 py-3 text-sm text-gray-500">
                ${t.card_name || '-'}
                ${t.card_last4 ? `<span class="text-gray-400 ml-1">****${t.card_last4}</span>` : ''}
            </td>
            <td class="px-4 py-3 text-sm text-gray-500">${t.bank_name || '-'}</td>
        </tr>
    `).join('');
}

function getCategoryEmoji(category) {
    const emojis = {
        'food': '🍽️', 'dining': '🍽️', 'groceries': '🛒', 'shopping': '🛍️',
        'travel': '✈️', 'fuel': '⛽', 'utilities': '💡', 'entertainment': '🎬',
        'healthcare': '🏥', 'education': '📚', 'other': '📦'
    };
    return emojis[category?.toLowerCase()] || '📦';
}

function updatePagination(total) {
    document.getElementById('pagination-info').textContent = 
        `Showing ${currentOffset + 1} to ${Math.min(currentOffset + limit, total)} of ${total}`;
    
    document.getElementById('prev-btn').disabled = currentOffset === 0;
    document.getElementById('next-btn').disabled = currentOffset + limit >= total;
}

function prevPage() {
    currentOffset = Math.max(0, currentOffset - limit);
    loadTransactions();
}

function nextPage() {
    currentOffset += limit;
    loadTransactions();
}

async function loadProfiles() {
    const res = await fetch('/api/profiles/');
    if (res.ok) {
        const data = await res.json();
        const select = document.getElementById('profile-filter');
        data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.name;
            select.appendChild(opt);
        });
    }
}

loadProfiles();
loadTransactions();
</script>
{% endblock %}
