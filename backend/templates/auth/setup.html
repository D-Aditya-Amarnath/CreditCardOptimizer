<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - OfferAgent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <span class="text-4xl">💳</span>
            <h1 class="text-2xl font-bold text-gray-900 mt-2">Welcome to OfferAgent</h1>
            <p class="text-gray-500 text-sm mt-1">Create your account</p>
        </div>
        <div class="card p-6">
            <form method="post">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" name="name" required class="input" placeholder="Your name">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" required class="input" placeholder="you@example.com">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" required minlength="6" class="input" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-full">Create Account</button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-4">
                Already have an account? <a href="/login" class="text-blue-600 hover:underline">Sign in</a>
            </p>
        </div>
    </div>
</body>
</html>
