<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OfferAgent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <span class="text-4xl">💳</span>
            <h1 class="text-2xl font-bold text-gray-900 mt-2">Financial Offer Agent</h1>
            <p class="text-gray-500 text-sm mt-1">Sign in to your account</p>
        </div>
        <div class="card p-6">
            {% if error %}
            <div class="bg-red-50 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">{{ error }}</div>
            {% endif %}
            <form method="post">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" required class="input" placeholder="you@example.com">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" required class="input" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-full">Sign In</button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-4">
                No account? <a href="/setup" class="text-blue-600 hover:underline">Set up</a>
            </p>
        </div>
    </div>
</body>
</html>
