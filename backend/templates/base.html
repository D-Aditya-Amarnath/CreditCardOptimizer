<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Financial Offer Agent{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .nav-link { @apply px-4 py-2 rounded-lg text-sm font-medium transition-colors; }
        .nav-link:hover { @apply bg-gray-100; }
        .nav-link.active { @apply bg-blue-600 text-white; }
        .card { @apply bg-white rounded-xl shadow-sm border border-gray-100; }
        .badge { @apply inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium; }
        .btn { @apply px-4 py-2 rounded-lg font-medium transition-colors; }
        .btn-primary { @apply bg-blue-600 text-white hover:bg-blue-700; }
        .btn-secondary { @apply bg-gray-100 text-gray-700 hover:bg-gray-200; }
        .input { @apply w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    {% if user %}
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <span class="text-xl font-bold text-blue-600">💳 OfferAgent</span>
                    <div class="hidden md:flex space-x-1">
                        <a href="/dashboard" class="nav-link {% if request.url.path == '/dashboard' %}active{% endif %}">Dashboard</a>
                        <a href="/chat/chat" class="nav-link {% if '/chat' in request.url.path %}active{% endif %}">Chat</a>
                        <a href="/compare" class="nav-link {% if '/compare' in request.url.path %}active{% endif %}">Compare</a>
                        <a href="/cards" class="nav-link {% if '/cards' in request.url.path %}active{% endif %}">My Cards</a>
                        <a href="/transactions" class="nav-link {% if '/transactions' in request.url.path %}active{% endif %}">Transactions</a>
                        <a href="/spend-analysis" class="nav-link {% if '/spend-analysis' in request.url.path %}active{% endif %}">Spending</a>
                        <a href="/emails" class="nav-link {% if '/emails' in request.url.path %}active{% endif %}">Emails</a>
                        <a href="/sync" class="nav-link {% if '/sync' in request.url.path %}active{% endif %}">Sync</a>
                        <a href="/profiles" class="nav-link {% if '/profiles' in request.url.path %}active{% endif %}">Profiles</a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button hx-get="/api/notifications/unread-count"
                            hx-trigger="revealed"
                            hx-swap="innerHTML"
                            onclick="document.getElementById('notif-panel').classList.toggle('hidden')"
                            class="relative p-2 text-gray-500 hover:text-gray-700">
                        <i class="fas fa-bell text-lg"></i>
                        <span id="notif-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
                    </button>
                    <div id="notif-panel" class="hidden absolute right-4 top-16 w-80 bg-white rounded-xl shadow-lg border border-gray-100 z-50">
                        <div class="p-4 border-b border-gray-100">
                            <span class="font-semibold text-sm">Notifications</span>
                        </div>
                        <div id="notif-list" class="max-h-64 overflow-y-auto"></div>
                    </div>
                    <span class="text-sm text-gray-600">{{ user.name }}</span>
                    <a href="/logout" class="text-sm text-gray-500 hover:text-gray-700">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <script>
        function loadNotifications() {
            fetch('/api/notifications?limit=5')
                .then(r => r.json())
                .then(data => {
                    const badge = document.getElementById('notif-badge');
                    if (data.unread_count > 0) {
                        badge.textContent = data.unread_count;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                });
        }
        if (document.getElementById('notif-badge')) {
            loadNotifications();
            setInterval(loadNotifications, 30000);
        }
        {% block extra_js %}{% endblock %}
    </script>
</body>
</html>
