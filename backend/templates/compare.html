{% extends "base.html" %}
{% block title %}Compare Offers - OfferAgent{% endblock %}
{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Compare Offers</h1>
    <p class="text-gray-500 text-sm">Find the best card for your purchase</p>
</div>

<div class="card p-6 mb-6">
    <div class="grid md:grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Merchant</label>
            <input type="text" id="compare-merchant" class="input" placeholder="e.g. Amazon, Swiggy, Myntra" value="Amazon">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Amount (₹)</label>
            <input type="number" id="compare-amount" class="input" placeholder="5000" value="5000">
        </div>
        <div class="flex items-end">
            <button onclick="compareOffers()" class="btn btn-primary w-full">Compare</button>
        </div>
    </div>
</div>

<div id="compare-results" class="card hidden">
    <div class="p-4 border-b border-gray-100">
        <h2 class="text-lg font-semibold">Results</h2>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Card</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cashback</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Min Spend</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Max Cap</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">You Save</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Valid Until</th>
                </tr>
            </thead>
            <tbody id="compare-tbody" class="divide-y divide-gray-50"></tbody>
        </table>
    </div>
    <div id="best-offer" class="p-4 bg-green-50 hidden"></div>
</div>

<script>
function compareOffers() {
    const merchant = document.getElementById('compare-merchant').value;
    const amount = document.getElementById('compare-amount').value;

    if (!merchant) return;

    fetch(`/api/offers/compare?merchant=${encodeURIComponent(merchant)}&amount=${amount}`)
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('compare-results');
            const tbody = document.getElementById('compare-tbody');
            const bestDiv = document.getElementById('best-offer');

            container.classList.remove('hidden');
            tbody.innerHTML = '';

            if (data.offers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">No offers found for this merchant</td></tr>';
                bestDiv.classList.add('hidden');
                return;
            }

            data.offers.forEach((offer, i) => {
                const isBest = i === 0;
                tbody.innerHTML += `
                    <tr class="${isBest ? 'bg-green-50' : ''}">
                        <td class="px-4 py-3 font-medium ${isBest ? 'text-green-700' : ''}">${offer.card_name} ${isBest ? '<span class="badge bg-green-100 text-green-800 ml-2">Best</span>' : ''}</td>
                        <td class="px-4 py-3">${offer.discount_percent || 'N/A'}%</td>
                        <td class="px-4 py-3">${offer.min_spend ? '₹' + offer.min_spend : 'Any'}</td>
                        <td class="px-4 py-3">${offer.max_cashback ? '₹' + offer.max_cashback : 'Uncapped'}</td>
                        <td class="px-4 py-3 font-bold ${isBest ? 'text-green-700' : 'text-gray-700'}">₹${offer.estimated_cashback}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${offer.valid_until ? offer.valid_until.slice(0, 10) : 'N/A'}</td>
                    </tr>
                `;
            });

            if (data.best_offer) {
                bestDiv.classList.remove('hidden');
                bestDiv.className = 'p-4 bg-green-50';
                bestDiv.innerHTML = `<strong>Best choice:</strong> ${data.best_offer.card_name} — saves ₹${data.best_offer.estimated_cashback} on ₹${amount} purchase`;
            }
        });
}
</script>
{% endblock %}
