{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Spend Analysis</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm text-gray-500 mb-1">Total (90 days)</div>
            <div class="text-2xl font-bold text-gray-900" id="total-90d">-</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm text-gray-500 mb-1">Monthly Average</div>
            <div class="text-2xl font-bold text-gray-900" id="avg-monthly">-</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm text-gray-500 mb-1">Transactions</div>
            <div class="text-2xl font-bold text-gray-900" id="total-txns">-</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm text-gray-500 mb-1">Trend</div>
            <div class="text-2xl font-bold" id="trend">
                <span class="text-gray-400">-</span>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4">Spending by Category</h2>
            <div id="category-chart" class="space-y-3"></div>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4">Monthly Trend</h2>
            <div id="monthly-chart" class="space-y-3"></div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold mb-4">Top Merchants</h2>
        <div id="top-merchants" class="space-y-3"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadSpendPattern() {
    const res = await fetch('/api/transactions/spend-pattern/');
    if (res.ok) {
        const data = await res.json();
        renderData(data);
    }
}

function renderData(data) {
    document.getElementById('total-90d').textContent = `₹${data.total_90d.toLocaleString('en-IN', { minimumFractionDigits: 0 })}`;
    document.getElementById('avg-monthly').textContent = `₹${data.avg_monthly.toLocaleString('en-IN', { minimumFractionDigits: 0 })}`;
    document.getElementById('total-txns').textContent = data.frequency.total_transactions;
    
    const trendEl = document.getElementById('trend');
    if (data.trend === 'increasing') {
        trendEl.innerHTML = '<span class="text-red-500"><i class="fas fa-arrow-up mr-1"></i>Increasing</span>';
    } else if (data.trend === 'decreasing') {
        trendEl.innerHTML = '<span class="text-green-500"><i class="fas fa-arrow-down mr-1"></i>Decreasing</span>';
    } else {
        trendEl.innerHTML = '<span class="text-blue-500"><i class="fas fa-minus mr-1"></i>Stable</span>';
    }
    
    const maxCat = Math.max(...Object.values(data.by_category));
    const categoryEl = document.getElementById('category-chart');
    categoryEl.innerHTML = Object.entries(data.by_category).map(([cat, amount]) => {
        const pct = (amount / maxCat) * 100;
        const emoji = getCategoryEmoji(cat);
        return `
            <div class="flex items-center">
                <div class="w-24 text-sm text-gray-600">${emoji} ${cat}</div>
                <div class="flex-1 mx-3">
                    <div class="bg-gray-200 rounded-full h-4">
                        <div class="bg-blue-500 h-4 rounded-full" style="width: ${pct}%"></div>
                    </div>
                </div>
                <div class="w-28 text-right text-sm font-medium">₹${amount.toLocaleString('en-IN', { minimumFractionDigits: 0 })}</div>
            </div>
        `;
    }).join('');
    
    const maxMonth = Math.max(...Object.values(data.monthly));
    const monthlyEl = document.getElementById('monthly-chart');
    monthlyEl.innerHTML = Object.entries(data.monthly).map(([month, amount]) => {
        const pct = maxMonth > 0 ? (amount / maxMonth) * 100 : 0;
        return `
            <div class="flex items-center">
                <div class="w-20 text-sm text-gray-600">${month}</div>
                <div class="flex-1 mx-3">
                    <div class="bg-gray-200 rounded-full h-4">
                        <div class="bg-green-500 h-4 rounded-full" style="width: ${pct}%"></div>
                    </div>
                </div>
                <div class="w-28 text-right text-sm font-medium">₹${amount.toLocaleString('en-IN', { minimumFractionDigits: 0 })}</div>
            </div>
        `;
    }).join('');
    
    const merchantsEl = document.getElementById('top-merchants');
    merchantsEl.innerHTML = data.top_merchants.map((m, i) => `
        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
            <div class="flex items-center">
                <span class="w-6 h-6 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm font-medium mr-3">${i + 1}</span>
                <span class="font-medium">${m.merchant}</span>
            </div>
            <div class="text-right">
                <div class="font-medium">₹${m.total.toLocaleString('en-IN', { minimumFractionDigits: 0 })}</div>
                <div class="text-xs text-gray-500">${m.count} transactions</div>
            </div>
        </div>
    `).join('');
}

function getCategoryEmoji(category) {
    const emojis = {
        'food': '🍽️', 'dining': '🍽️', 'groceries': '🛒', 'shopping': '🛍️',
        'travel': '✈️', 'fuel': '⛽', 'utilities': '💡', 'entertainment': '🎬',
        'healthcare': '🏥', 'education': '📚', 'other': '📦'
    };
    return emojis[category?.toLowerCase()] || '📦';
}

loadSpendPattern();
</script>
{% endblock %}
