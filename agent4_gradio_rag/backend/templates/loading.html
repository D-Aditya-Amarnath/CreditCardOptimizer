{% extends "base.html" %}

{% block extra_head %}
<style>
@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}
.shimmer {
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
}
.spinner {
    border: 3px solid #f3f3f3;
    border-top: 3px solid #3b82f6;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-12">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Syncing Your Emails</h1>
        <p class="text-gray-500" id="status-text">Preparing to sync...</p>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <div id="progress-container">
            <div class="flex items-center justify-between mb-4">
                <span class="text-sm font-medium text-gray-700" id="current-account">-</span>
                <span class="text-sm text-gray-500" id="progress-text">0 / 0</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3 mb-4">
                <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div id="results-container" class="hidden">
            <div id="sync-results" class="space-y-3"></div>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-lg font-semibold mb-4">Loading Dashboard</h2>
        <div class="space-y-4">
            <div class="shimmer h-8 rounded"></div>
            <div class="grid grid-cols-4 gap-4">
                <div class="shimmer h-24 rounded"></div>
                <div class="shimmer h-24 rounded"></div>
                <div class="shimmer h-24 rounded"></div>
                <div class="shimmer h-24 rounded"></div>
            </div>
            <div class="shimmer h-48 rounded"></div>
        </div>
    </div>

    <div class="text-center mt-8" id="skip-container">
        <button onclick="skipSync()" class="text-gray-400 hover:text-gray-600 text-sm">
            Skip and go to Dashboard <i class="fas fa-arrow-right ml-1"></i>
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let isComplete = false;

function connectSSE() {
    const es = new EventSource('/api/accounts/sync-stream');
    
    es.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        if (data.type === 'starting') {
            document.getElementById('current-account').textContent = data.account;
            document.getElementById('status-text').textContent = `Syncing ${data.account}...`;
        }
        
        if (data.type === 'progress') {
            const pct = Math.round((data.current / data.total) * 100);
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('progress-text').textContent = `${data.current} / ${data.total}`;
        }
        
        if (data.type === 'completed') {
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('progress-text').textContent = 'Done';
            
            document.getElementById('results-container').classList.remove('hidden');
            const results = document.getElementById('sync-results');
            results.innerHTML += `
                <div class="flex items-center justify-between p-3 bg-green-50 rounded-lg">
                    <div>
                        <div class="font-medium text-green-800">${data.account}</div>
                        <div class="text-sm text-green-600">
                            ${data.emails} emails, ${data.offers} offers, ${data.transactions} transactions
                        </div>
                    </div>
                    <i class="fas fa-check-circle text-green-500 text-xl"></i>
                </div>
            `;
        }
        
        if (data.type === 'error') {
            document.getElementById('results-container').classList.remove('hidden');
            const results = document.getElementById('sync-results');
            results.innerHTML += `
                <div class="flex items-center justify-between p-3 bg-red-50 rounded-lg">
                    <div>
                        <div class="font-medium text-red-800">${data.account}</div>
                        <div class="text-sm text-red-600">${data.error}</div>
                    </div>
                    <i class="fas fa-exclamation-circle text-red-500 text-xl"></i>
                </div>
            `;
        }
        
        if (data.type === 'no_accounts') {
            document.getElementById('status-text').textContent = data.message;
            isComplete = true;
            setTimeout(() => window.location.href = '/dashboard', 1500);
        }
        
        if (data.type === 'all_done') {
            isComplete = true;
            document.getElementById('status-text').textContent = 'Sync complete!';
            document.getElementById('skip-container').innerHTML = `
                <button onclick="window.location.href='/dashboard'" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                    Go to Dashboard <i class="fas fa-arrow-right ml-1"></i>
                </button>
            `;
        }
    };
    
    es.onerror = function() {
        if (!isComplete) {
            document.getElementById('status-text').textContent = 'Connection lost. Retrying...';
            setTimeout(connectSSE, 3000);
        }
    };
}

function skipSync() {
    window.location.href = '/dashboard';
}

connectSSE();
</script>
{% endblock %}
